<style>

<script>
// <LOGIC>
const MONTHS_ES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function stripAccents(s){return String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'');}
function normKey(s){return stripAccents(s).toLowerCase().replace(/[^a-z0-9]/g,'');}
function isLeap(y){return (y%4===0&&y%100!==0)||y%400===0;}
function daysIn(m,y){return [31,isLeap(y)?29:28,31,30,31,30,31,31,30,31,30,31][m-1];}

function parseCSV(text){
  if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);
  const first=text.split(/\r?\n/,1)[0]||'';
  const delim=first.split(';').length>=first.split(',').length?';':',';
  const rows=[];let row=[],field='',inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){
      if(c==='"'){if(text[i+1]==='"'){field+='"';i++;}else inQ=false;}
      else field+=c;
    }else if(c==='"')inQ=true;
    else if(c===delim){row.push(field);field='';}
    else if(c==='\n'){row.push(field);rows.push(row);row=[];field='';}
    else if(c!=='\r')field+=c;
  }
  if(field!==''||row.length){row.push(field);rows.push(row);}
  return rows.filter(r=>r.some(x=>x.trim()!==''));
}

function parseDob(s){
  s=String(s==null?'':s).trim();if(!s)return null;
  let m,d,mo,y=null;
  if((m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4}|\d{2})/))){d=+m[1];mo=+m[2];y=m[3];}
  else if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))){y=m[1];mo=+m[2];d=+m[3];}
  else if((m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})$/))){d=+m[1];mo=+m[2];}
  else return null;
  if(mo<1||mo>12||d<1||d>daysIn(mo,2000))return null;
  return {d:d,m:mo,y:y};
}

function classifyPhone(raw){
  const s=String(raw==null?'':raw).trim();if(!s)return null;
  const intl=/^(\+|00)/.test(s);
  let d=s.replace(/\D/g,'');
  if(/^00/.test(s))d=d.replace(/^00/,'');
  if(intl){
    if(d.startsWith('34')&&d.length===11)d=d.slice(2);
    else return (d.length>=10&&d.length<=15)?{wa:d,mobile:true}:null;
  }else if(d.length===11&&d.startsWith('34'))d=d.slice(2);
  if(d.length!==9)return null;
  return {wa:'34'+d,mobile:/^[67]/.test(d)};
}

// Identificador estable: nombre + apellidos + día/mes (no depende del orden del archivo ni de IdAccount).
function fingerprint(n,a,d,m){
  const s=normKey(n)+'|'+normKey(a)+'|'+d+'/'+m;
  let h1=0x811c9dc5,h2=0x1b873593;
  for(let i=0;i<s.length;i++){
    const c=s.charCodeAt(i);
    h1^=c;h1=Math.imul(h1,0x01000193)>>>0;
    h2^=c;h2=Math.imul(h2,0x85ebca6b)>>>0;
  }
  return 'h'+h1.toString(36)+h2.toString(36);
}
// Prioridad de columnas de teléfono: contacto, luego 2º, luego profesional (por nombre, no por posición).
function phoneRank(h){
  if(h.indexOf('profesional')>=0)return 3;
  if(/^2|segundo/.test(h))return 2;
  return 1;
}

function buildContacts(rows){
  if(!rows.length)throw new Error('El archivo está vacío.');
  const hdr=rows[0].map(normKey);
  const iNom=hdr.indexOf('nombre'),iApe=hdr.indexOf('apellidos');
  const iDob=hdr.findIndex(h=>h.indexOf('fechanac')===0||h==='cumpleanos'||h==='nacimiento');
  const iTel=[];hdr.forEach((h,i)=>{if(h.indexOf('telefono')>=0||h.indexOf('movil')>=0)iTel.push(i);});
  iTel.sort((a,b)=>phoneRank(hdr[a])-phoneRank(hdr[b])||a-b);
  const missing=[];
  if(iNom<0&&hdr.indexOf('nombrecompleto')>=0)missing.push('"Nombre" y "Apellidos" por separado (el archivo trae "Nombre completo")');
  else{if(iNom<0)missing.push('"Nombre"');if(iApe<0)missing.push('"Apellidos"');}
  if(iDob<0)missing.push('"Fecha nacimiento"');
  if(!iTel.length)missing.push('al menos un teléfono');
  if(missing.length)throw new Error('Faltan campos en el archivo: '+missing.join(', ')+'. Vuelve a exportar del portal marcándolos.');
  const used=new Set([iNom,iApe,iDob].concat(iTel));
  const ignored=rows[0].map((h,i)=>used.has(i)?null:String(h).trim()).filter(Boolean);
  const contacts=[],seen=new Map();
  const stats={read:0,mobile:0,noMobile:0,badDate:0,skipped:0,ignored:ignored,hasNif:hdr.some(h=>h==='nif'||h==='dni')};
  rows.slice(1).forEach(r=>{
    stats.read++;
    const nombre=(r[iNom]||'').trim(),apellidos=(r[iApe]||'').trim();
    if(!nombre&&!apellidos){stats.skipped++;return;}
    const dob=parseDob(r[iDob]);
    if(!dob){stats.badDate++;return;}
    let mobile='';const f=[];
    iTel.forEach(j=>{
      const c=classifyPhone(r[j]);if(!c)return;
      if(c.mobile){if(!mobile)mobile=c.wa;}
      else if(f.indexOf(c.wa)<0)f.push(c.wa);
    });
    let id=fingerprint(nombre,apellidos,dob.d,dob.m);
    const k=seen.get(id)||0;seen.set(id,k+1);if(k)id+='-'+(k+1);
    contacts.push({i:id,n:nombre,a:apellidos,d:dob.d,m:dob.m,y:dob.y,p:mobile?[mobile]:[],f:f});
    if(mobile)stats.mobile++;else stats.noMobile++;
  });
  return {contacts:contacts,stats:stats};
}

function titleCase(s){
  s=String(s==null?'':s).trim();
  if(s!==s.toUpperCase()&&s!==s.toLowerCase())return s;
  return s.toLowerCase().replace(/(^|[\s\-'])(\p{L})/gu,function(m,a,b){return a+b.toUpperCase();});
}
function fullName(c){return (titleCase(c.n)+' '+titleCase(c.a)).trim();}
function msgName(c){return titleCase(c.n||c.a);}
function fmtPhone(wa){
  if(/^34\d{9}$/.test(wa))return wa.slice(2).replace(/(\d{3})(\d{2})(\d{2})(\d{2})/,'$1 $2 $3 $4');
  return '+'+wa;
}

function bdMs(c,year){
  const day=(c.m===2&&c.d===29&&!isLeap(year))?28:c.d;
  return Date.UTC(year,c.m-1,day);
}
function occurrences(contacts,todayMs,todayY,back,fwd){
  const out=[];
  contacts.forEach(c=>{
    [todayY-1,todayY,todayY+1].forEach(y=>{
      const diff=Math.round((bdMs(c,y)-todayMs)/86400000);
      if(diff>=-back&&diff<=fwd)out.push({c:c,diff:diff,year:y});
    });
  });
  out.sort((a,b)=>a.diff-b.diff||(a.c.a||'').localeCompare(b.c.a||'','es')||(a.c.n||'').localeCompare(b.c.n||'','es'));
  return out;
}
function nextOcc(c,todayMs,todayY){
  for(const y of [todayY,todayY+1]){
    const diff=Math.round((bdMs(c,y)-todayMs)/86400000);
    if(diff>=0)return {c:c,diff:diff,year:y};
  }
}
// Días seguidos sin oficina justo después de hoy (sábado y domingo si hoy es viernes). dow: 0=domingo ... 6=sábado.
function isWorkday(dow){return dow>=1&&dow<=5;}
function closedAhead(dow){let k=0;while(k<4&&!isWorkday((dow+k+1)%7))k++;return k;}
// Plan de avisos para el móvil. Se recalcula al abrir la app, al importar y al marcar "Hecho", así que cuenta lo que falta de verdad.
// Entre semana: mañana y tarde (incluye lo atrasado de los últimos 3 días, p. ej. el fin de semana). Viernes: resumen del fin de semana.
// Sábado y domingo: solo los que cumplen ese día.
const NOTIF_TIMES={morning:[9,0],afternoon:[16,0],friday:[13,30],weekend:[10,0]};
function planNotifications(contacts,sent,now,days,times){
  times=times||NOTIF_TIMES;
  const out=[],nowMs=now.getTime();
  for(let off=0;off<=days;off++){
    const dt=new Date(now.getFullYear(),now.getMonth(),now.getDate()+off);
    const y=dt.getFullYear(),m=dt.getMonth()+1,d=dt.getDate(),dow=dt.getDay();
    const occ=occurrences(contacts,Date.UTC(y,m-1,d),y,3,2);
    const unsent=o=>sent[o.c.i]!==o.year;
    const ymd=y*10000+m*100+d;
    const push=(slot,hm,type,count,body)=>{
      const when=new Date(y,m-1,d,hm[0],hm[1],0).getTime();
      if(when<=nowMs)return;
      out.push({id:ymd*10+slot,when:when,type:type,count:count,title:'Cumpleaños de clientes',body:body});
    };
    if(isWorkday(dow)){
      const n=occ.filter(o=>o.diff<=0&&unsent(o)).length;
      if(n>0){
        push(1,times.morning,'hoy',n,'Hoy tienes '+n+' '+(n===1?'cliente':'clientes')+' por felicitar.');
        push(2,times.afternoon,'recordatorio',n,'Te '+(n===1?'queda 1 cliente':'quedan '+n+' clientes')+' por felicitar hoy.');
      }
      if(dow===5){
        const w=occ.filter(o=>o.diff>=1&&o.diff<=2&&unsent(o)).length;
        if(w>0)push(3,times.friday,'finde',w,'Este fin de semana '+(w===1?'cumple 1 cliente':'cumplen '+w+' clientes')+'. Acuérdate de llevarte el móvil.');
      }
    }else{
      const n=occ.filter(o=>o.diff===0&&unsent(o)).length;
      if(n>0)push(4,times.weekend,'hoy',n,'Hoy '+(n===1?'cumple 1 cliente':'cumplen '+n+' clientes')+'. ¡Felicít'+(n===1?'ale':'ales')+'!');
    }
  }
  out.sort((a,b)=>a.when-b.when);
  return out;
}
function buildMessage(tpl,name){return String(tpl).replace(/\{nombre\}/gi,name);}
function waLink(wa,text){return 'https://wa.me/'+wa+'?text='+encodeURIComponent(text);}
// </LOGIC>

/* ---------- Estado y almacenamiento ---------- */
const APP_VERSION='0.5.10';
const KEY_C='cumples-clientes:contactos:v1',KEY_S='cumples-clientes:estado:v1';
const DEFAULT_MSG='¡Feliz cumpleaños, {nombre}! 🎂 Te mandamos un abrazo y deseamos que disfrutes mucho de tu día.';
const STALE_DAYS=30;
function lsGet(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){state.storageOK=false;return false;}}
function probeStorage(){try{localStorage.setItem('cumples-clientes:probe','1');localStorage.removeItem('cumples-clientes:probe');return true;}catch(e){return false;}}
function loadTpl(t){
  if(t&&typeof t.text==='string')return {text:t.text};
  if(t&&Array.isArray(t.items)&&t.items[t.active|0])return {text:t.items[t.active|0].text};
  return {text:DEFAULT_MSG};
}

function todayInfo(){const n=new Date(),y=n.getFullYear(),m=n.getMonth()+1,d=n.getDate();return {y:y,m:m,d:d,ms:Date.UTC(y,m-1,d),dow:n.getDay()};}

function demoContacts(){
  const t=todayInfo();
  const mk=(off,n,a,k)=>{const dt=new Date(t.y,t.m-1,t.d+off);return {i:'demo'+k,n:n,a:a,d:dt.getDate(),m:dt.getMonth()+1,y:'80',p:['34600000000'],f:[],demo:true};};
  return [mk(-1,'Marta','Ejemplo Uno',1),mk(0,'José Luis','Ejemplo Dos',2),mk(0,'Ainhoa','Ejemplo Tres',3),mk(1,'Carlos','Ejemplo Cuatro',4),mk(3,'Lucía','Ejemplo Cinco',5),mk(5,'Iñaki','Ejemplo Seis',6)];
}

const CAP=window.Capacitor;
const NATIVE=!!(CAP&&typeof CAP.isNativePlatform==='function'&&CAP.isNativePlatform());
const REPO='Calabia78/agenda-cumples';
const KEY_N='cumples-clientes:avisos:v1';
const KEY_T='cumples-clientes:tema:v1';
function loadTheme(){try{const t=localStorage.getItem(KEY_T);return (t==='light'||t==='dark')?t:'auto';}catch(e){return 'auto';}}
function applyTheme(t){const r=document.documentElement;if(t==='light'||t==='dark')r.setAttribute('data-theme',t);else r.removeAttribute('data-theme');}
let LN=null,AG=null;
// El puente nativo de Capacitor (sin empaquetador) solo ofrece nativePromise: llamamos a los plugins con él.
function nativePlugin(name){return new Proxy({},{get:function(t,m){if(typeof m!=='string'||m==='then')return undefined;return function(a){return CAP.nativePromise(name,m,a||{});};}});}
if(NATIVE&&typeof CAP.nativePromise==='function'){LN=nativePlugin('LocalNotifications');AG=nativePlugin('AgendaNative');}
let syncTimer=0,notifPerm='unknown';
function scheduleSync(){if(!NATIVE||!LN)return;clearTimeout(syncTimer);syncTimer=setTimeout(syncNotifications,500);}
async function notifPermission(ask){
  try{
    let p=await LN.checkPermissions();
    if(p.display!=='granted'&&ask)p=await LN.requestPermissions();
    notifPerm=p.display;return p.display==='granted';
  }catch(e){notifPerm='error';return false;}
}
async function syncNotifications(){
  if(!NATIVE||!LN)return;
  try{
    const granted=await notifPermission(false);
    const pend=await LN.getPending();
    const old=(pend&&pend.notifications||[]).filter(n=>n.id>1000000);
    if(old.length)await LN.cancel({notifications:old.map(n=>({id:n.id}))});
    if(!granted||state.demo)return;
    try{await LN.createChannel({id:'cumples',name:'Cumpleaños de clientes',description:'Avisos de cumpleaños',importance:4,visibility:1,vibration:true});}catch(e){}
    const plan=planNotifications(contactsAll(),state.sent,new Date(),21).slice(0,60);
    if(plan.length)await LN.schedule({notifications:plan.map(x=>({id:x.id,title:x.title,body:x.body,channelId:'cumples',schedule:{at:new Date(x.when),allowWhileIdle:true}}))});
  }catch(e){}
}
async function refreshNotifStatus(){
  if(!NATIVE||!LN)return;
  await notifPermission(false);
  const el=$('#notif-status');if(!el)return;
  if(notifPerm==='granted')el.innerHTML='<span class="msg-ok">Avisos activados.</span> <button class="btn" data-act="test-notif">Enviarme un aviso de prueba</button>';
  else el.innerHTML='<span class="msg-err">Los avisos están desactivados.</span> <button class="btn primary" data-act="enable-notif">Activar avisos</button><span class="muted small" style="display:block;margin-top:.4rem">Si no te sale la ventana para permitirlos, actívalos en Ajustes del móvil → Aplicaciones → Cumples → Notificaciones.</span>';
}
async function testNotif(){

function b64ToBytes(b64){const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
async function pickNative(){
  try{
    const r=await AG.pickFile();
    if(!r||r.cancelled)return;
    const bytes=b64ToBytes(r.data);
    await handleFile({arrayBuffer:function(){return Promise.resolve(bytes.buffer);},uri:r.uri,name:r.name});
  }catch(e){state.pending=null;state.importMsg={ok:false,text:'No se pudo leer el archivo: '+((e&&e.message)||e)};render();}
}
async function deleteImported(uri,msg){
  let ok=false;
  try{const r=await AG.deleteFile({uri:uri});ok=!!(r&&r.deleted);}catch(e){}
  if(msg&&msg.notes&&msg.notes.length){
    msg.notes[msg.notes.length-1]=ok?'He borrado el archivo descargado de tu móvil.':'No he podido borrar el archivo descargado: bórralo tú desde la carpeta Descargas.';
    if(state.view==='ajustes'&&state.importMsg===msg)render();
  }
}
function cmpVer(a,b){
  const x=String(a).replace(/^v/,'').split('.').map(Number),y=String(b).replace(/^v/,'').split('.').map(Number);
  for(let i=0;i<3;i++){const p=x[i]||0,q=y[i]||0;if(p!==q)return p>q?1:-1;}
  return 0;
}
async function checkUpdate(silent){
  if(!NATIVE)return;
  state.upd={busy:true};
  if(!silent&&state.view==='ajustes')render();
  try{
    const ctl=new AbortController(),to=setTimeout(function(){ctl.abort();},12000);
    const r=await fetch('https://api.github.com/repos/'+REPO+'/releases/latest',{headers:{'Accept':'application/vnd.github+json'},signal:ctl.signal});
    clearTimeout(to);
    if(r.status===404){state.upd={uptodate:true};}
    else{
      if(!r.ok)throw new Error('HTTP '+r.status);
      const j=await r.json(),ver=String(j.tag_name||'').replace(/^v/,'');
      const asset=(j.assets||[]).find(function(a){return /\.apk$/i.test(a.name);});
      state.upd=(ver&&asset&&cmpVer(ver,APP_VERSION)>0)?{newer:true,ver:ver,url:asset.browser_download_url}:{uptodate:true};
    }
  }catch(e){state.upd={error:true};}
  if(state.view==='ajustes'&&!silent)render();
  else if(state.view==='home'&&!state.q&&state.upd.newer)render();
}
async function installUpdate(){
  if(!NATIVE||!state.upd||!state.upd.url)return;
  const u=state.upd;
  if(!AG){u.msg='No está disponible la instalación desde la app; te abro la descarga en el navegador.';render();try{window.location.href=u.url;}catch(e){}return;}
  u.installing=true;u.msg='';
  if(state.view==='ajustes')render();else toast('Descargando la actualización…');
  try{
    const r=await AG.installApk({url:u.url});
    if(r&&r.needsPermission)u.msg='Android necesita tu permiso: activa «Permitir de esta fuente», vuelve a la app y pulsa otra vez.';
    else u.msg='Descargada. Si no ves la pantalla de instalación, pulsa «Instalar» en el aviso que ha salido.';
  }catch(e){
    u.msg='No se pudo instalar desde la app ('+((e&&e.message)||e)+'). Te abro la descarga en el navegador.';
    try{AG.openUrl({url:u.url});}catch(x){}
  }
  u.installing=false;
  if(state.view==='ajustes')render();
}
async function bootNative(){
  if(!NATIVE||!LN)return;
  let asked=false;try{asked=localStorage.getItem(KEY_N)==='1';}catch(e){}
  if(!asked){try{localStorage.setItem(KEY_N,'1');}catch(e){}await notifPermission(true);}
  await syncNotifications();
  checkUpdate(true);
}

/* ---------- Filas ---------- */
function tagFor(o,done,ahead){
  if(done)return '<span class="tag ok">Felicitado</span>';
  if(ahead)return '<span class="tag today">Cumple el '+esc(dayName(o.diff))+'</span>';
  if(o.diff<0)return '<span class="tag late">Hace '+(-o.diff)+' '+plural(-o.diff,'día','días')+'</span>';
  if(o.diff===0)return '<span class="tag today">Hoy</span>';
  if(o.diff===1)return '<span class="tag">Mañana</span>';
  return '<span class="tag">En '+o.diff+' días</span>';
}
function editorHTML(c){
  const ov=state.over[c.i]||{},id=esc(c.i);
  return '<div class="editor">'
    +'<label>Felicitar como<input id="ed-alias" class="field" value="'+esc(ov.alias||'')+'" placeholder="'+esc(msgName(c))+'" autocomplete="off"></label>'
    +'<label>Felicitar en otro número<input id="ed-tel" class="field" type="tel" inputmode="tel" value="'+esc(ov.tel?fmtPhone(ov.tel):'')+'" placeholder="Móvil de otra persona o número alternativo" autocomplete="off"></label>'
    +'<p class="muted small">El texto se puede cambiar en WhatsApp antes de enviarlo. Esto se guarda solo en este dispositivo y se conserva al actualizar la lista.</p>'
    +'<div class="btns"><button class="btn primary" data-act="ed-save" data-id="'+id+'">Guardar</button><button class="btn" data-act="ed-cancel">Cancelar</button>'
    +((ov.alias||ov.tel)?'<button class="btn" data-act="ed-clear" data-id="'+id+'">Quitar apodo y número</button>':'')+'</div></div>';
}
function rowHTML(o,opts){
  opts=opts||{};
  const c=o.c,id=c.i,eid=esc(id),done=state.sent[id]===o.year&&opts.showDone!==false;
  const ov=state.over[id]||{},own=(c.p||[])[0],wa=c.demo?own:targetPhone(c),lf=(c.f||[])[0];
  const cls=['row',o.diff<0?'is-late':o.diff===0?'is-today':'is-future'];
  if(done)cls.push('done');
  if(state.opened[id])cls.push('opened');
  let phoneHtml='';
  if(wa)phoneHtml='<span class="phone">'+esc(fmtPhone(wa))+'</span>'+(ov.tel&&!c.demo?'<span class="tag">otro nº</span>':'');
  else if(lf)phoneHtml='<span class="phone">'+esc(fmtPhone(lf))+'</span><span>fijo</span>';
  if(ov.alias&&!c.demo)phoneHtml+='<span>Felicitar como <b>'+esc(ov.alias)+'</b></span>';
  const editBtn=c.demo?'':'<button class="mini" data-act="edit" data-id="'+eid+'">Apodo / otro nº</button>';
  const soft=opts.soft||o.diff>0;
  let action;
  if(c.demo)action='<span class="wa off">Ejemplo</span>';
  else if(wa){
    const text=buildMessage(state.tpl.text,greetName(c));
    action='<a class="wa'+(soft?' soft':'')+'" href="'+esc(waLink(wa,text))+'" target="_blank" rel="noopener noreferrer" data-id="'+eid+'">'+ICON_CAKE+'Felicitar</a>';
  }else{
    action='<span class="nophone">Sin móvil</span>';
    if(lf)action+='<a class="wa soft" href="'+esc(waLink(lf,buildMessage(state.tpl.text,greetName(c))))+'" target="_blank" rel="noopener noreferrer" data-id="'+eid+'">Probar con el fijo</a>';
    action+='<button class="btn" data-act="edit" data-id="'+eid+'">Añadir número</button>';
  }
  if(done&&!c.demo&&(wa||lf))action='<span class="wa off">✓ Felicitado</span>';
  const doneBtn=opts.showDone===false?'':'<button class="done-btn'+(done?' on':'')+'" data-act="done" data-id="'+eid+'" data-year="'+o.year+'" title="Marcar como felicitado">'+(done?'Deshacer':'Hecho')+'</button>';
  return '<li class="'+cls.join(' ')+'"><div class="date"><span class="dd">'+c.d+'</span><span class="mm">'+MONTHS_ES[c.m-1]+'</span></div>'
    +'<div class="who"><div class="name">'+esc(fullName(c))+'</div><div class="meta">'+tagFor(o,done,opts.ahead)+phoneHtml+editBtn+'</div></div>'
    +'<div class="acts">'+action+doneBtn+'</div>'
    +((state.editing===id&&!c.demo)?editorHTML(c):'')+'</li>';

function listHTML(items,opts){return '<ul class="list">'+items.map(o=>rowHTML(o,opts)).join('')+'</ul>';}

/* ---------- Pantalla principal ---------- */
function banners(){
  let h='';
  if(state.demo)h+='<div class="banner"><span><strong>Datos de ejemplo.</strong> Son contactos inventados para que veas cómo funciona.</span><span class="banner-links"><button class="mini" data-act="import-now">Cargar tu CSV</button><button class="mini" data-act="settings">Añadirte para probar</button></span></div>';
  else if(state.imported){
    const days=Math.floor((Date.now()-state.imported)/86400000);
    if(days>=STALE_DAYS)h+='<div class="banner"><span>Hace '+days+' días que no actualizas la lista de clientes.</span><button class="mini" data-act="import-now">Actualizar lista</button></div>';
  }
  if(NATIVE&&state.upd&&state.upd.newer)h+='<div class="banner"><span><strong>Hay una versión nueva ('+esc(state.upd.ver)+').</strong></span><button class="mini" data-act="install-update">Actualizar</button></div>';
  if(!state.storageOK)h+='<div class="banner"><span><strong>Este navegador no guarda datos.</strong> Tendrás que cargar el CSV cada vez.</span></div>';
  return h;
}
function homeData(){
  const t=todayInfo(),k=closedAhead(t.dow);
  const occ=occurrences(contactsAll(),t.ms,t.y,3,Math.max(7,k));
  const unsent=o=>state.sent[o.c.i]!==o.year;
  const late=occ.filter(o=>o.diff<0&&unsent(o));
  const today=occ.filter(o=>o.diff===0);
  const ahead=k>0?occ.filter(o=>o.diff>=1&&o.diff<=k):[];
  const next=occ.filter(o=>o.diff>k&&o.diff<=7);
  const pendT=today.filter(unsent).length,pendA=ahead.filter(unsent).length;
  return {t:t,k:k,late:late,today:today,ahead:ahead,next:next,pendT:pendT,pendA:pendA,pend:late.length+pendT};
}
function viewHome(){
  const d=homeData(),t=d.t;
  const f=new Intl.DateTimeFormat('es-ES',{weekday:'long',day:'numeric',month:'long'}).format(new Date(t.y,t.m-1,t.d));
  let head,sub;
  if(d.pend>0){
    const parts=[];
    if(d.pendT)parts.push(d.pendT+' de hoy');
    if(d.late.length)parts.push(d.late.length+' '+plural(d.late.length,'atrasado','atrasados'));

  }else if(d.today.length||d.ahead.length){
    head='Todo al día';
    sub=d.ahead.length?(d.t.dow===5?'Este fin de semana':'Mañana')+' '+(d.ahead.length===1?'cumple 1 cliente':'cumplen '+d.ahead.length+' clientes')+': llévate el móvil':'Ya has felicitado a todos los de hoy';
  }
  else{head='Hoy no cumple nadie';sub='Mira los próximos días';}
  $view.innerHTML='<div class="stick"><section class="hero"><div class="hero-top"><div><div class="hero-date">'+esc(f.charAt(0).toUpperCase()+f.slice(1))+'</div><div class="hero-title">Cumpleaños de clientes</div></div>'
    +'<button class="icon-btn" data-act="settings" aria-label="Ajustes">'+ICON_SET+'</button></div>'
    +'<div class="hero-count"><span class="big">'+(d.pend>0?d.pend:(d.today.length||d.ahead.length?'✓':'0'))+'</span><div class="hero-sub"><strong>'+esc(head)+'</strong><small>'+esc(sub)+'</small></div></div></section>'
    +'<label class="search">'+ICON_SEARCH+'<input id="q" type="search" placeholder="Buscar cliente por nombre o teléfono" value="'+esc(state.q)+'" autocomplete="off" aria-label="Buscar cliente"></label></div>'
    +banners()
    +'<div id="home-body"></div>';
  renderHomeBody();
}
function filteredAll(){
  const q=stripAccents(state.q).toLowerCase().trim(),qd=q.replace(/\D/g,'');
  let list=contactsAll().filter(c=>{
    const nm=stripAccents((c.n||'')+' '+(c.a||'')).toLowerCase();
    return nm.indexOf(q)>=0||(qd.length>=3&&(c.p||[]).concat(c.f||[]).some(p=>p.indexOf(qd)>=0));
  });
  list.sort((a,b)=>(a.a||'').localeCompare(b.a||'','es')||(a.n||'').localeCompare(b.n||'','es'));
  return list;
}
function renderHomeBody(){
  const el=$('#home-body');if(!el)return;
  if(state.q.trim()){
    const t=todayInfo(),all=filteredAll(),slice=all.slice(0,state.shown);
    let h='<h2 class="sec">Resultados <span class="count">'+fmtN(all.length)+'</span></h2>';
    if(!all.length)h+='<p class="empty">Nadie coincide con la búsqueda.</p>';
    else{
      h+='<ul class="list">'+slice.map(c=>{const o=nextOcc(c,t.ms,t.y);return rowHTML(o,{showDone:false,soft:o.diff>3});}).join('')+'</ul>';
      if(all.length>slice.length)h+='<button class="btn more" data-act="more">Mostrar más ('+fmtN(all.length-slice.length)+' restantes)</button>';
    }
    el.innerHTML=h;return;
  }
  const d=homeData();let h='';
  if(d.late.length)h+='<h2 class="sec late">Sin felicitar de días anteriores <span class="count">'+d.late.length+'</span></h2>'+listHTML(d.late);
  if(d.today.length)h+='<h2 class="sec">Hoy <span class="count">'+d.today.length+'</span></h2>'+listHTML(d.today);
  if(d.ahead.length){
    h+='<h2 class="sec">'+(d.t.dow===5?'Este fin de semana':'Mañana, '+dayName(1))+' <span class="count">'+d.ahead.length+'</span></h2>'
      +'<p class="sec-note">Acuérdate de llevarte el móvil: cuando llegue el día, aparecerán arriba para felicitarles.</p>'+listHTML(d.ahead,{ahead:true});
  }
  if(d.next.length)h+='<h2 class="sec">Próximos 7 días <span class="count">'+d.next.length+'</span></h2>'+listHTML(d.next,{showDone:false});
  if(!h)h='<p class="empty">No hay cumpleaños en los próximos 7 días.</p>';
  el.innerHTML=h;
}

  let h='<div class="bar"><button class="icon-btn solid" data-act="back" aria-label="Volver">'+ICON_BACK+'</button><h2>Ajustes</h2></div>';
  h+='<section class="panel"><h3>Mensaje de felicitación</h3><p class="muted small">Es el mismo para todos los clientes. Escribe {nombre} donde quieras que salga el nombre; si a un cliente le has puesto un apodo, sale el apodo. Siempre se puede cambiar en WhatsApp antes de enviar.</p>'
    +'<textarea id="msg" class="field" rows="4" aria-label="Mensaje de felicitación">'+esc(state.tpl.text)+'</textarea>'
    +'<p class="preview" id="msg-prev">'+esc(previewText(state.tpl.text))+'</p>'
    +'<button class="btn" data-act="reset-msg">Restaurar mensaje original</button></section>';
  if(NATIVE){
    const th=loadTheme();
    h+='<section class="panel"><h3>Aspecto</h3><p class="muted small">Elige si la app se ve clara, oscura o como tenga el móvil.</p><div class="btns">'
      +[['auto','Automático'],['light','Claro'],['dark','Oscuro']].map(function(o){return '<button class="btn'+(th===o[0]?' primary':'')+'" data-act="theme" data-v="'+o[0]+'">'+o[1]+'</button>';}).join('')
      +'</div></section>';
  }
  h+='<section class="panel"><h3>Lista de clientes</h3>'
    +'<p class="muted small">'+(real?fmtN(n)+' contactos, '+fmtN(withMobile)+' con móvil'+(last?'. Última actualización: '+esc(last)+'.':'.'):'Ahora mismo ves contactos de ejemplo.')+'</p>'
    +'<p class="muted small">Al exportar del portal marca solo: <b>Nombre</b>, <b>Apellidos</b>, <b>Fecha nacimiento</b> y los teléfonos (<b>Teléfono contacto</b>, <b>2º Teléfono contacto</b>, <b>Teléfono profesional</b>). No hace falta NIF, IdAccount ni Nombre completo. Se usa un solo móvil por persona, en ese orden.</p>'
    +'<p class="muted small">Para actualizar la lista, vuelve a cargar el archivo: se añaden los nuevos, se quitan los que ya no están y se conserva lo felicitado, los apodos y los números añadidos. Después, borra el archivo descargado.</p>'
    +(NATIVE?'<p style="margin:.75rem 0 0"><button class="btn primary" data-act="pick-file">Elegir archivo CSV</button></p><p class="muted small">Al terminar la importación, la app intenta borrar por ti el archivo descargado.</p>'
      :'<div class="drop" id="drop"><p style="margin-top:0">Arrastra aquí el archivo o elígelo</p><input type="file" id="file" accept=".csv,.txt,text/csv" aria-label="Archivo CSV"></div>');
  if(state.pending){
    const p=state.pending;
    h+='<p class="msg-err" style="margin-bottom:.4rem">Este archivo tiene '+fmtN(p.res.contacts.length)+' contactos y ahora tienes '+fmtN(p.prevN)+'. Si lo aplicas, se quitarán '+fmtN(p.removed)+'. ¿Es el archivo correcto?</p>'
      +'<div class="btns"><button class="btn danger" data-act="import-apply">Aplicar de todos modos</button><button class="btn" data-act="import-cancel">Cancelar</button></div>';
  }
  if(state.importMsg){
    const m=state.importMsg;
    h+='<p class="'+(m.ok?'msg-ok':'msg-err')+'" style="margin-bottom:0">'+esc(m.text)+'</p>';
    if(m.stats){
      const s=m.stats;
      h+='<ul class="stats"><li><b>'+fmtN(s.contacts)+'</b><span>contactos</span></li><li><b>'+fmtN(s.mobile)+'</b><span>con móvil</span></li><li><b>'+fmtN(s.noMobile)+'</b><span>sin móvil</span></li><li><b>'+fmtN(s.added)+'</b><span>nuevos</span></li><li><b>'+fmtN(s.removed)+'</b><span>ya no están</span></li><li><b>'+fmtN(s.omitted)+'</b><span>omitidos</span></li></ul>';
    }
    (m.notes||[]).forEach(x=>{h+='<p class="muted small" style="margin:.5rem 0 0">'+esc(x)+'</p>';});
    if(m.ok)h+='<p style="margin:.75rem 0 0"><button class="btn primary" data-act="back">Ver los cumpleaños de hoy</button></p>';
  }
  h+='</section>';
  const plan=planNotifications(contactsAll(),state.sent,new Date(),21).slice(0,6);
  const fmtWhen=new Intl.DateTimeFormat('es-ES',{weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'});
  h+='<section class="panel"><h3>'+(NATIVE?'Avisos del móvil':'Avisos del móvil (vista previa)')+'</h3><p class="muted small">'+(NATIVE?'La app te avisa':'Así te avisaría la app instalada en el móvil')+': a las 9:00 y a las 16:00 entre semana, el viernes a las 13:30 con el resumen del fin de semana, y el sábado y el domingo a las 10:00.'+(NATIVE?' Abajo ves los próximos.':' Aquí solo puedes ver cuáles serían los próximos.')+'</p>'
    +(NATIVE?'<p id="notif-status" class="muted small">Comprobando…</p><p class="muted small">Si algún día no te llega un aviso, en Ajustes del móvil → Aplicaciones → Cumples → Batería, elige «Sin restricciones».</p>':'')
    +(plan.length?'<ul class="manual-list">'+plan.map(x=>{const w=fmtWhen.format(new Date(x.when));return '<li style="display:block"><b>'+esc(w.charAt(0).toUpperCase()+w.slice(1))+'</b><br><span class="muted small">'+esc(x.body)+'</span></li>';}).join('')+'</ul>':'<p class="muted small">No hay avisos previstos en las próximas semanas.</p>')
    +'</section>';
  h+='<section class="panel"><h3>Probar con tu propio móvil</h3><p class="muted small">Añade un contacto a mano: ponte a ti con la fecha de hoy y pulsa Felicitar en la pantalla principal. Los contactos añadidos a mano se conservan al actualizar la lista.</p>'
    +'<div class="form-grid"><label>Nombre<input id="m-n" class="field" autocomplete="off"></label><label>Apellidos<input id="m-a" class="field" autocomplete="off"></label>'
    +'<label>Cumpleaños (día/mes)<input id="m-f" class="field" inputmode="numeric" value="'+hoy+'" autocomplete="off"></label><label>Móvil<input id="m-t" class="field" type="tel" inputmode="tel" autocomplete="off"></label></div>'
    +'<p style="margin:.75rem 0 0"><button class="btn primary" data-act="add-manual">Añadir contacto</button></p>';
  if(state.manual.length)h+='<ul class="manual-list">'+state.manual.map(c=>'<li><span>'+esc(fullName(c))+' · '+c.d+'/'+c.m+(c.p&&c.p[0]?' · '+esc(fmtPhone(c.p[0])):'')+'</span><button class="btn" data-act="del-manual" data-id="'+esc(c.i)+'">Eliminar</button></li>').join('')+'</ul>';
  h+='</section>';
  h+='<section class="panel"><h3>Copia de seguridad</h3><p class="muted small">Guarda lo felicitado, los apodos, los números añadidos, los contactos a mano y el mensaje. Los contactos del CSV se recuperan volviendo a cargarlo. Copia el texto y guárdalo donde quieras, por ejemplo en una nota.</p>'
    +'<p><button class="btn" data-act="gen-backup">Generar copia</button></p>'
    +(state.backupOut?'<textarea id="backup-out" class="field" rows="4" readonly aria-label="Texto de la copia">'+esc(state.backupOut)+'</textarea><p style="margin-top:.5rem"><button class="btn" data-act="copy-backup">Copiar al portapapeles</button></p>':'')
    +'<p class="muted small" style="margin-top:1rem">Para restaurar, pega aquí el texto de una copia:</p>'
    +'<textarea id="backup-in" class="field" rows="3" placeholder="Pega la copia aquí" aria-label="Pegar copia de seguridad"></textarea>'
    +'<p style="margin-top:.5rem"><button class="btn" data-act="restore">Restaurar copia</button></p></section>';
  h+='<section class="panel"><h3>Borrar datos</h3><p class="muted small">Elimina de este dispositivo los contactos, lo felicitado, los apodos, los números añadidos y el mensaje.</p>'
    +'<button class="btn danger'+(state.armed?' armed':'')+'" data-act="wipe">'+(state.armed?'Pulsa otra vez para confirmar':'Borrar todos los datos')+'</button></section>';
  if(NATIVE){
    const u=state.upd||{};
    let line='';
    if(u.busy)line='<span class="muted small">Buscando…</span>';
    else if(u.newer)line='<span class="msg-ok">Hay una versión nueva: '+esc(u.ver)+'.</span> <button class="btn primary" data-act="install-update"'+(u.installing?' disabled':'')+'>'+(u.installing?'Descargando…':'Descargar e instalar')+'</button><span class="muted small" style="display:block;margin-top:.4rem">Tus datos se conservan al actualizar. Si Android te lo pide, permite instalar desde esta app.</span>'+(u.msg?'<span class="msg-err" style="display:block;margin-top:.4rem">'+esc(u.msg)+'</span>':'');
    else if(u.uptodate)line='<span class="msg-ok">Tienes la última versión.</span>';
    else if(u.error)line='<span class="msg-err">No he podido comprobarlo. Revisa la conexión.</span>';
    h+='<section class="panel"><h3>Actualizaciones</h3><p class="muted small">Versión instalada: '+APP_VERSION+'</p><p style="margin:.4rem 0 .6rem">'+line+'</p><button class="btn" data-act="check-update"'+(u.busy?' disabled':'')+'>Buscar actualización</button></section>';
  }else h+='<p class="muted small" style="margin-top:1.25rem">Versión '+APP_VERSION+'</p>';
  $view.innerHTML=h;
}

function render(){
  const y=window.scrollY;
  (state.view==='ajustes'?viewAjustes:viewHome)();
  window.scrollTo(0,y);
}
function go(v){state.view=v;state.editing=null;state.q='';state.shown=40;render();window.scrollTo(0,0);if(v==='ajustes')refreshNotifStatus();}

/* ---------- Importación, contactos a mano y copia ---------- */
function applyImport(res,added,removed,uri){
  state.contacts=res.contacts;state.demo=false;state.opened={};state.editing=null;state.imported=Date.now();state.pending=null;
  if(!lsSet(KEY_C,res.contacts))toast('No he podido guardar los datos en este dispositivo');
  persist();
  const s=res.stats,notes=[];
  if(s.ignored.length)notes.push('Columnas que no se han guardado: '+s.ignored.join(', ')+'.');
  if(s.hasNif)notes.push('El archivo incluye NIF. No hace falta y no se guarda; la próxima vez no lo marques al exportar.');
  notes.push(uri?'Borrando el archivo descargado…':'Cuando termines, borra el archivo descargado del dispositivo.');
  state.importMsg={ok:true,text:'Importación completada.',notes:notes,stats:{contacts:res.contacts.length,mobile:s.mobile,noMobile:s.noMobile,added:added,removed:removed,omitted:s.badDate+s.skipped}};
  toast(fmtN(res.contacts.length)+' contactos cargados');
  render();
  if(uri&&NATIVE&&AG)deleteImported(uri,state.importMsg);
}
async function handleFile(file){
  if(!file)return;
  try{
    const buf=await file.arrayBuffer();
    let text;
    try{text=new TextDecoder('utf-8',{fatal:true}).decode(buf);}catch(e){text=new TextDecoder('windows-1252').decode(buf);}
    const res=buildContacts(parseCSV(text));
    if(!res.contacts.length)throw new Error('No he encontrado ningún contacto con fecha de nacimiento válida.');
    const prev=state.demo?[]:state.contacts;
    const before=new Set(prev.map(c=>c.i)),after=new Set(res.contacts.map(c=>c.i));
    const added=res.contacts.filter(c=>!before.has(c.i)).length;
    const removed=prev.filter(c=>!after.has(c.i)).length;
    if(prev.length>=20&&res.contacts.length<prev.length*0.7){
      state.pending={res:res,added:added,removed:removed,prevN:prev.length,uri:file.uri||null};state.importMsg=null;render();return;
    }
    applyImport(res,added,removed,file.uri||null);
  }catch(err){
    state.pending=null;state.importMsg={ok:false,text:'No se pudo importar: '+err.message};render();
  }
}
function addManual(){
  const n=($('#m-n').value||'').trim(),a=($('#m-a').value||'').trim(),f=($('#m-f').value||'').trim(),t=($('#m-t').value||'').trim();
  if(!n){toast('Escribe un nombre');return;}
  const dob=parseDob(f);
  if(!dob){toast('La fecha debe ser día/mes, por ejemplo 12/10');return;}
  let p=[];
  if(t){const c=classifyPhone(t);if(!c){toast('Ese número no es válido');return;}p=[c.wa];}
  state.manual.push({i:'m'+Date.now().toString(36)+Math.floor(Math.random()*1296).toString(36),n:n,a:a,d:dob.d,m:dob.m,y:null,p:p,f:[],manual:true});
  persist();render();toast('Contacto añadido');
}
function saveEditor(id){
  const alias=($('#ed-alias').value||'').trim(),telRaw=($('#ed-tel').value||'').trim();
  let tel='';
  if(telRaw){const c=classifyPhone(telRaw);if(!c){toast('Ese número no es válido');return;}tel=c.wa;}
  if(alias||tel)state.over[id]={alias:alias,tel:tel};else delete state.over[id];
  state.editing=null;persist();render();toast('Guardado');
}
function backupText(){return JSON.stringify({v:3,sent:state.sent,tpl:state.tpl,over:state.over,manual:state.manual});}
function restoreBackup(raw){
  let o;
  try{o=JSON.parse(raw);}catch(e){toast('El texto no es una copia válida');return;}
  if(!o||[1,2,3].indexOf(o.v)<0||typeof o.sent!=='object'){toast('El texto no es una copia válida');return;}
  state.sent=o.sent||{};
  if(o.v>=2){state.over=(o.over&&typeof o.over==='object')?o.over:{};state.manual=Array.isArray(o.manual)?o.manual:[];}
  if(o.tpl)state.tpl=loadTpl(o.tpl);
  persist();render();toast('Copia restaurada');
}

/* ---------- Eventos ---------- */
document.addEventListener('click',function(e){
  const wa=e.target.closest('a.wa');
  if(wa){state.opened[wa.dataset.id]=true;const row=wa.closest('.row');if(row)row.classList.add('opened');
    // Al pulsar Felicitar se da por felicitado (se puede deshacer). Los de días futuros no se marcan.
    const db=row&&row.querySelector('.done-btn');
    if(db&&!row.classList.contains('is-future')&&state.sent[wa.dataset.id]!==+db.dataset.year){
      state.sent[wa.dataset.id]=+db.dataset.year;persist();
      setTimeout(function(){render();toast('Marcado como felicitado');},500);
    }
    if(NATIVE&&AG){e.preventDefault();AG.openUrl({url:wa.href}).catch(function(){toast('No he podido abrir WhatsApp');});}
    return;}
  const t=e.target.closest('[data-act]');if(!t)return;
  const act=t.dataset.act;
  if(act==='settings')go('ajustes');
  else if(act==='theme'){const v=t.dataset.v;try{localStorage.setItem(KEY_T,v);}catch(err){}applyTheme(v);render();if(AG)AG.setTheme({mode:v}).catch(function(){});}
  else if(act==='import-now'){go('ajustes');if(NATIVE&&AG)pickNative();else{const d=$('#drop');if(d)d.scrollIntoView({block:'center'});}}
  else if(act==='pick-file')pickNative();
  else if(act==='check-update')checkUpdate(false);
  else if(act==='install-update')installUpdate();
  else if(act==='enable-notif'){notifPermission(true).then(function(){syncNotifications();refreshNotifStatus();});}
  else if(act==='test-notif')testNotif();
  else if(act==='back')go('home');
  else if(act==='done'){
    const id=t.dataset.id,y=+t.dataset.year;
    if(state.sent[id]===y)delete state.sent[id];else state.sent[id]=y;
    persist();render();
  }
  else if(act==='edit'){
    state.editing=(state.editing===t.dataset.id)?null:t.dataset.id;render();
    const a=$('#ed-alias');
    if(a){a.focus({preventScroll:true});setTimeout(function(){const li=a.closest('li');if(li)li.scrollIntoView({block:'start',behavior:'smooth'});},350);}
  }
  else if(act==='ed-save')saveEditor(t.dataset.id);
  else if(act==='ed-cancel'){state.editing=null;render();}
  else if(act==='ed-clear'){delete state.over[t.dataset.id];state.editing=null;persist();render();toast('Quitado');}
  else if(act==='add-manual')addManual();
  else if(act==='del-manual'){
    state.manual=state.manual.filter(c=>c.i!==t.dataset.id);delete state.over[t.dataset.id];delete state.sent[t.dataset.id];
    persist();render();toast('Contacto eliminado');
  }
  else if(act==='import-apply'&&state.pending){const p=state.pending;applyImport(p.res,p.added,p.removed,p.uri);}
  else if(act==='import-cancel'){state.pending=null;render();}
  else if(act==='more'){state.shown+=40;renderHomeBody();}
  else if(act==='reset-msg'){state.tpl={text:DEFAULT_MSG};persist();render();toast('Mensaje original restaurado');}
  else if(act==='gen-backup'){
    state.backupOut=backupText();render();
    const ta=$('#backup-out');if(ta){ta.focus();ta.select();}
  }
  else if(act==='copy-backup'){
    const ta=$('#backup-out');
    const fallback=function(){if(ta){ta.focus();ta.select();}toast('Selecciona el texto y cópialo con Ctrl+C');};
    try{navigator.clipboard.writeText(state.backupOut).then(function(){toast('Copia en el portapapeles');},fallback);}catch(err){fallback();}
  }
  else if(act==='restore'){const ta=$('#backup-in');restoreBackup(ta?ta.value.trim():'');}
  else if(act==='wipe'){
    if(!state.armed){state.armed=true;render();setTimeout(function(){if(state.armed){state.armed=false;if(state.view==='ajustes')render();}},5000);return;}
    try{localStorage.removeItem(KEY_C);localStorage.removeItem(KEY_S);}catch(err){}
    state.contacts=demoContacts();state.demo=true;state.imported=0;state.sent={};state.over={};state.manual=[];state.opened={};state.editing=null;state.importMsg=null;state.pending=null;state.backupOut='';state.armed=false;
    state.tpl={text:DEFAULT_MSG};
    scheduleSync();render();toast('Datos borrados');
  }
});
document.addEventListener('input',function(e){
  const t=e.target;
  if(t.id==='q'){state.q=t.value;state.shown=40;renderHomeBody();}
  else if(t.id==='msg'){state.tpl.text=t.value;persist();const p=$('#msg-prev');if(p)p.textContent=previewText(t.value);}
});
document.addEventListener('change',function(e){
  const t=e.target;
  if(t.id==='file'){handleFile(t.files&&t.files[0]);}
});
['dragover','dragenter'].forEach(ev=>document.addEventListener(ev,function(e){const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.add('over');}}));
['dragleave','drop'].forEach(ev=>document.addEventListener(ev,function(e){const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.remove('over');if(ev==='drop'&&e.dataTransfer&&e.dataTransfer.files[0])handleFile(e.dataTransfer.files[0]);}}));
// Con el teclado abierto en un campo de la lista, la cabecera deja de estar fija para dejar sitio.
document.addEventListener('focusin',function(e){const t=e.target;if(t&&t.matches&&t.matches('input,textarea')&&!t.closest('.stick'))document.body.classList.add('kb');});
document.addEventListener('focusout',function(){setTimeout(function(){const a=document.activeElement;if(!(a&&a.matches&&a.matches('input,textarea')&&!a.closest('.stick')))document.body.classList.remove('kb');},60);});
let lastDay=todayInfo().ms;
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible'&&todayInfo().ms!==lastDay){lastDay=todayInfo().ms;if(state.demo)state.contacts=demoContacts();render();}
  if(document.visibilityState==='visible')scheduleSync();
});

if(NATIVE)applyTheme(loadTheme());
render();
bootNative();
</script>
